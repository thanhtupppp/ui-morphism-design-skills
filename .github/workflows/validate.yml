name: Validate UI Morphism Design Skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate repository
        run: node scripts/validate-repo.mjs

      - name: Validate quality gates
        run: node scripts/validate-quality-gates.mjs
