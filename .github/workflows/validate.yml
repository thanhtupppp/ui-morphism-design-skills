name: Validate UI Morphism Design Skill

on:
  push:
    branches:
      - main
      - ai-agent/chatgpt-skill-compat-1.9
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Test Skill validator
        run: python3 -m unittest tests/test-skill-validator.py

      - name: Test deterministic packager and release metadata
        run: python3 -m unittest tests/test-packager.py

      - name: Test trigger eval router, thresholds, and baseline
        run: python3 -m unittest tests/test-evals.py

      - name: Validate ChatGPT Skill source tree
        run: python3 scripts/validate-skill-package.py . --format json --output skill-validation.json

      - name: Build deterministic release artifact twice
        shell: bash
        run: |
          mkdir -p release-a release-b
          python3 scripts/package-skill.py --root . --output release-a/skill.zip --json
          python3 scripts/package-skill.py --root . --output release-b/skill.zip --json
          cmp release-a/skill.zip release-b/skill.zip
          cmp release-a/skill-package-manifest.json release-b/skill-package-manifest.json
          cmp release-a/skill.sbom.cdx.json release-b/skill.sbom.cdx.json
          cmp release-a/skill.provenance.json release-b/skill.provenance.json
          test "$(sha256sum release-a/skill.zip | cut -d' ' -f1)" = "$(sha256sum release-b/skill.zip | cut -d' ' -f1)"

      - name: Validate built skill.zip
        run: python3 scripts/validate-skill-package.py release-a/skill.zip --format json --output package-validation.json

      - name: Verify release artifact graph
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("release-a")
          archive = root / "skill.zip"
          manifest = root / "skill-package-manifest.json"
          checksum = root / "skill.zip.sha256"
          sbom = root / "skill.sbom.cdx.json"
          provenance = root / "skill.provenance.json"
          for path in (archive, manifest, checksum, sbom, provenance):
              assert path.is_file(), path

          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert checksum.read_text(encoding="utf-8") == f"{digest}  skill.zip\n"
          statement = json.loads(provenance.read_text(encoding="utf-8"))
          assert statement["subject"][0]["digest"]["sha256"] == digest
          byproducts = {item["name"]: item["digest"]["sha256"] for item in statement["predicate"]["byproducts"]}
          assert byproducts["skill-package-manifest.json"] == hashlib.sha256(manifest.read_bytes()).hexdigest()
          assert byproducts["skill.sbom.cdx.json"] == hashlib.sha256(sbom.read_bytes()).hexdigest()
          bom = json.loads(sbom.read_text(encoding="utf-8"))
          assert bom["bomFormat"] == "CycloneDX" and bom["specVersion"] == "1.6"
          print(json.dumps({"archive_sha256": digest, "sbom_components": len(bom["components"]), "provenance_revision": statement["predicate"]["buildDefinition"]["externalParameters"]["source"]["revision"]}, indent=2))
          PY

      - name: Print Skill validation report
        if: always()
        run: |
          cat skill-validation.json || true
          cat package-validation.json || true
          cat release-a/skill.zip.sha256 || true

      - name: Run trigger, thresholds, baseline, and semantic parity evals
        id: evals
        continue-on-error: true
        run: python3 scripts/run-evals.py --thresholds evals/thresholds.json --baseline evals/baseline.json --output eval-report.json

      - name: Publish eval job summary
        if: always()
        shell: bash
        run: |
          if [ -f eval-report.json ]; then
            python3 scripts/render-eval-summary.py eval-report.json --output eval-summary.md
            cat eval-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## UI Morphism Eval Summary\n\n**FAIL** - eval-report.json was not produced.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Print eval diagnostics
        if: always()
        shell: bash
        run: |
          if [ -f eval-report.json ]; then
            python3 - <<'PY'
          import json
          report = json.load(open("eval-report.json", encoding="utf-8"))
          payload = {
              "summary": report.get("summary", {}),
              "threshold_failures": report.get("thresholds", {}).get("failures", []),
              "baseline_regressions": report.get("baseline", {}).get("regressions", []),
          }
          print(json.dumps(payload, indent=2))
          PY
          fi

      - name: Enforce eval result
        if: always()
        shell: bash
        run: |
          test -f eval-report.json
          python3 - <<'PY'
          import json
          import sys
          report = json.load(open("eval-report.json", encoding="utf-8"))
          sys.exit(0 if report.get("ok") else 1)
          PY

      - name: Validate repository
        run: node scripts/validate-repo.mjs

      - name: Validate quality gates
        run: node scripts/validate-quality-gates.mjs

      - name: Validate semantic parity
        run: node scripts/validate-semantic-parity.mjs

      - name: Validate accessibility parity
        run: node scripts/validate-accessibility-parity.mjs
