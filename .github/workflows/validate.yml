name: Validate UI Morphism Design Skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test Skill validator
        run: python3 -m unittest tests/test-skill-validator.py

      - name: Test trigger eval router
        run: python3 -m unittest tests/test-evals.py

      - name: Validate ChatGPT Skill package
        run: python3 scripts/validate-skill-package.py . --format json --output skill-validation.json

      - name: Print Skill validation report
        if: always()
        run: cat skill-validation.json || true

      - name: Run trigger and semantic parity evals
        run: python3 scripts/run-evals.py --output eval-report.json

      - name: Print eval report summary
        if: always()
        run: python3 -c "import json; r=json.load(open('eval-report.json')); print(json.dumps(r['summary'], indent=2))" || true

      - name: Validate repository
        run: node scripts/validate-repo.mjs

      - name: Validate quality gates
        run: node scripts/validate-quality-gates.mjs

      - name: Validate semantic parity
        run: node scripts/validate-semantic-parity.mjs

      - name: Validate accessibility parity
        run: node scripts/validate-accessibility-parity.mjs
