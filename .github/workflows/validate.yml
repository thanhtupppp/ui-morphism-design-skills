name: Validate UI Morphism Design Skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate repository
        run: node scripts/validate-repo.mjs

      - name: Validate quality gates
        run: node scripts/validate-quality-gates.mjs

      - name: Validate semantic parity
        run: node scripts/validate-semantic-parity.mjs

      - name: Validate accessibility parity
        run: node scripts/validate-accessibility-parity.mjs

      - name: Validate component parity
        run: node scripts/validate-component-parity.mjs

      - name: Test component parity validation
        run: node --test scripts/validate-component-parity.test.mjs
